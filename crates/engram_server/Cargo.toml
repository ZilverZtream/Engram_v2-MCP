[package]
name = "engram_server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["vector"]
vector = ["engram_index/vector"]

[dependencies]
engram_core = { path = "../engram_core" }
engram_index = { path = "../engram_index", default-features = false }
engram_graph = { path = "../engram_graph" }
engram_git = { path = "../engram_git" }
engram_ml = { path = "../engram_ml" }

anyhow.workspace = true
thiserror = "2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bincode.workspace = true
schemars.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

rmcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
blake3.workspace = true
sha2.workspace = true
regex.workspace = true
# Parse authored guidance links with document-local CommonMark definitions.
pulldown-cmark = { version = "0.13", default-features = false }
git2.workspace = true
notify.workspace = true
zip = "2.2"
reqwest.workspace = true
dashmap.workspace = true
redb.workspace = true
futures.workspace = true
async-trait.workspace = true
fs2.workspace = true
tempfile = "3"
# Unified-diff of two ADO blob versions for review fix-exemplar mining.
similar = "2"
sqlparser = { version = "0.59", features = ["visitor"] }

[build-dependencies]
blake3 = "1"

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

