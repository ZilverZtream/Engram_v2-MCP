name: benchmark-ci

on:
  pull_request:
  push:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  benchmark-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Test frozen-task protocol and quality-check exit status (no model evaluation)
        id: task_protocol
        run: |
          set -o pipefail
          mkdir -p benchmark-artifacts
          ENGRAM_TEST_TMPDIR="$PWD/benchmark-artifacts" python3 -B -m unittest discover -s eval -p 'test_frozen_task_*.py' -v 2>&1 | tee benchmark-artifacts/frozen-task-protocol.log

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-benchmark-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-benchmark-

      - name: Run benchmark unit tests
        id: benchmark
        run: |
          mkdir -p benchmark-artifacts
          cargo test -p engram_core --lib benchmark -- --nocapture 2>&1 | tee benchmark-artifacts/benchmark-core.log
          cargo test -p engram_server --lib autonomous_decision -- --nocapture 2>&1 | tee benchmark-artifacts/adp-tests.log

      - name: Run ADP corpus replay tests
        id: adp
        run: |
          cargo test -p engram_server --lib corpus_runner -- --nocapture 2>&1 | tee benchmark-artifacts/adp-corpus.log

      - name: Run WebForms mutation tests
        id: webforms
        run: |
          cargo test -p engram_index --test webforms_mutation_test -- --nocapture 2>&1 | tee benchmark-artifacts/mutation-tests.log

      - name: Run VB/C# parity stress matrix tests
        id: parity
        run: |
          cargo test -p engram_index --test parity_stress_matrix_test -- --nocapture 2>&1 | tee benchmark-artifacts/parity-tests.log

      - name: Run reproducibility tests
        id: reproducibility
        run: |
          cargo test -p engram_server --test reproducibility_test -- --nocapture --test-threads=1 2>&1 | tee benchmark-artifacts/reproducibility-tests.log

      - name: Run authored language corpus tests
        id: language_corpora
        run: |
          cargo test -p engram_server --test language_corpora_test -- --nocapture --test-threads=1 2>&1 | tee benchmark-artifacts/language-corpora-tests.log

      - name: Generate benchmark report artifact
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          ADP_OUTCOME: ${{ steps.adp.outcome }}
          WEBFORMS_OUTCOME: ${{ steps.webforms.outcome }}
          PARITY_OUTCOME: ${{ steps.parity.outcome }}
          REPRODUCIBILITY_OUTCOME: ${{ steps.reproducibility.outcome }}
          TASK_PROTOCOL_OUTCOME: ${{ steps.task_protocol.outcome }}
          LANGUAGE_CORPORA_OUTCOME: ${{ steps.language_corpora.outcome }}
        run: |
          mkdir -p benchmark-artifacts
          {
            printf '%s\n' '## Benchmark CI Report' '' "**Build:** $GITHUB_SHA" ''
            printf '%s\n' '| Check | Outcome |' '| --- | --- |'
            printf '| Frozen-task protocol and quality-check exit status (no model run) | %s |\n' "${TASK_PROTOCOL_OUTCOME:-not_run}"
            printf '| Benchmark and decision contracts | %s |\n' "${BENCHMARK_OUTCOME:-not_run}"
            printf '| ADP corpus replay | %s |\n' "${ADP_OUTCOME:-not_run}"
            printf '| WebForms mutation | %s |\n' "${WEBFORMS_OUTCOME:-not_run}"
            printf '| VB/C# parity | %s |\n' "${PARITY_OUTCOME:-not_run}"
            printf '| Reproducibility | %s |\n' "${REPRODUCIBILITY_OUTCOME:-not_run}"
            printf '| TS/Python/Rust/Go source corpora | %s |\n' "${LANGUAGE_CORPORA_OUTCOME:-not_run}"
            printf '\n%s\n' 'These checks do not establish held-out task quality or real-project productivity.'
          } > benchmark-artifacts/summary.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmark-artifacts/
          retention-days: 90
