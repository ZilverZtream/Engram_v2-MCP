[workspace]
resolver = "2"
members = [
  "crates/engram_core",
  "crates/engram_index",
  "crates/engram_graph",
  "crates/engram_git",
  "crates/engram_ml",
  "crates/engram_server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }

# Core infra
directories = "5"
redb = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Search + vectors
tantivy = "0.24"
lancedb = "0.26"
lance-arrow = "2"
arrow = "57"
arrow-array = "57"
arrow-schema = "57"

# Parsing
walkdir = "2"
ignore = "0.4"
blake3 = "1"
notify = "7"

# MCP
rmcp = { version = "0.3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"

# Git
git2 = "0.20"

# Graph
petgraph = "0.8"
rustworkx-core = "0.16"

# AST
# tree-sitter 0.25 accepts ABI 14 (all 0.23.x grammar crates) and ABI 15
# (arborium-vb 2.16.0, built with tree-sitter CLI 0.25).
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# HTTP client (for Ollama / OpenAI remote backends)
reqwest = { version = "0.13", features = ["json"] }

# Binary serialization
bincode = "1"

# Concurrent collections
dashmap = "6"

# Utils
regex = "1"
